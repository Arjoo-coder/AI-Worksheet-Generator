spring:
  application:
    name: ai-worksheet-generator
  servlet:
    multipart:
      max-request-size: 25MB
      max-file-size: 25MB

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 25MB

app:
  # ---- CORS ----
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

  # ---- AI provider ----
  # Default / primary provider is LOCAL OLLAMA, called via its native
  # /api/chat endpoint. No API key is required or sent for Ollama.
  ai:
    provider: ${AI_PROVIDER:ollama}
    api-url: ${OLLAMA_API_URL:http://localhost:11434/api/chat}
    api-key: ${AI_API_KEY:}
    model: ${OLLAMA_MODEL:qwen2.5:3b}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:600}
    max-tokens: ${LLM_MAX_TOKENS:1200}
    max-content-chars: ${LLM_MAX_CONTENT_CHARS:60000}
    max-retries: ${LLM_MAX_RETRIES:1}

  # ---- PDF conversion (LibreOffice headless) ----
  pdf:
    soffice-path: ${SOFFICE_PATH:soffice}
    conversion-timeout-seconds: ${PDF_CONVERSION_TIMEOUT_SECONDS:60}

logging:
  level:
    com.university.worksheet: INFO
